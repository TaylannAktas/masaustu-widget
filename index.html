<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masaüstü Widget</title>
  <link rel="stylesheet" href="/src/manager/styles.css" />
  <script type="module" src="/src/manager/main.ts"></script>
</head>
<body>
  <aside>
    <div class="brand">Masaüstü Widget</div>
    <div class="new-wrap">
      <button id="new" class="primary" aria-haspopup="menu">+ Yeni widget</button>
      <div id="templates" class="menu" role="menu" hidden></div>
    </div>
    <ul id="list"></ul>
    <details class="perf">
      <summary>Performans</summary>
      <label><input type="checkbox" id="pauseCovered" /> Üstü kapalıyken dondur</label>
      <p class="note">Büyütülmüş ya da tam ekran bir pencere monitörü kaplıyorsa oradaki widget'lar durur, kaldığı yerden devam eder.</p>
      <label><input type="checkbox" id="pauseBattery" /> Pildeyken dondur</label>
    </details>
    <button id="editMode" class="ghost" title="Widget'ları masaüstünde sürükleyip boyutlandır">Masaüstünde düzenle</button>
    <div class="aside-foot">
      <button id="import" class="ghost">İçe aktar</button>
      <button id="export" class="ghost">Dışa aktar</button>
    </div>
  </aside>

  <main>
    <div id="empty" class="empty">Soldan bir widget seç ya da yeni bir tane oluştur.</div>

    <div id="editor" hidden>
      <div class="topbar">
        <input id="name" class="name" placeholder="Widget adı" />
        <label class="switch"><input type="checkbox" id="enabled" /> Masaüstünde göster</label>
        <span class="spacer"></span>
        <button id="dup" class="ghost">Çoğalt</button>
        <button id="del" class="ghost danger">Sil</button>
      </div>

      <div class="props">
        <label>Monitör <select id="monitor"></select></label>
        <label>X <input type="number" id="x" step="1" /></label>
        <label>Y <input type="number" id="y" step="1" /></label>
        <label>Genişlik <input type="number" id="w" min="20" step="1" /></label>
        <label>Yükseklik <input type="number" id="h" min="20" step="1" /></label>
        <label class="opacity">Opaklık <input type="range" id="opacity" min="0.05" max="1" step="0.05" /> <output id="opacityOut"></output></label>
      </div>

      <div class="work">
        <section class="code">
          <div class="tabs" role="tablist">
            <button role="tab" data-tab="html" class="active">HTML</button>
            <button role="tab" data-tab="css">CSS</button>
            <button role="tab" data-tab="js">JS</button>
          </div>
          <textarea id="code" spellcheck="false" aria-label="Kod"></textarea>
        </section>
        <section class="side">
          <div class="pane-title">Önizleme <small id="sizeInfo"></small></div>
          <div id="stage" class="stage"><iframe id="preview" sandbox="allow-scripts" title="Önizleme"></iframe></div>
          <div class="pane-title">Monitördeki yeri</div>
          <div id="map" class="map"></div>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <span id="status"></span>
    <span class="spacer"></span>
    <code id="path"></code>
    <button id="save" class="primary" disabled>Kaydet <kbd>Ctrl+S</kbd></button>
  </footer>
</body>
</html>
